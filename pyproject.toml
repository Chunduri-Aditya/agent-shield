[project]
name = "agent-shield"
version = "0.1.0"
description = "Evaluation framework for stress testing LLM agents across adversarial attack surfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
    "inspect-evals[agentdojo]",
    "groq>=1.2.0",
]

[project.scripts]
agent-shield-research = "agent_shield.research_cli:main"
agent-shield-guard = "agent_shield.runtime.cli:main"
agent-shield-mcp-proxy = "agent_shield.runtime.mcp_proxy_cli:main"
agent-shield-proof = "agent_shield.runtime.proof_cli:main"
agent-shield-tr-v2 = "agent_shield.tr_v2_cli:main"
agent-shield-corpus = "agent_shield.external_corpus.cli:main"

# The agent_shield/ package (metrics, schema, targets, runtime) is pure-stdlib and is the
# unit other projects import. The heavy harness deps above are only needed to run
# the Inspect tasks under evals/. Downstream consumers that only want the metrics
# layer install with: pip install -e . --no-deps
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent_shield",
    "agent_shield.targets",
    "agent_shield.runtime",
    "agent_shield.disclosure",
    "agent_shield.external_corpus",
]

[dependency-groups]
dev = [
    "inspect-ai>=0.3.207",
    "anthropic>=0.96.0",
    "openai>=2.32.0",
    "google-genai>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "mypy>=1.20.1",
]

[tool.uv.sources]
inspect-evals = { path = "../inspect_evals", editable = true }

[tool.ruff]
line-length = 100
extend-exclude = [
    ".claude",
    ".venv",
    "Papers",
    "github_Repos",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

# Keep one multiline import per module when symbols share the same `from` root.
[tool.ruff.lint.isort]
split-on-trailing-comma = false

# scripts/dpo_pairs.py stores preference-pair prose as string literals. Reflowing
# them to satisfy the line limit would join across newlines, which can silently
# add or drop a space and change the training data itself. The payloads are
# evidence, so the data file is exempted rather than edited to please the linter.
[tool.ruff.lint.per-file-ignores]
"scripts/dpo_pairs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
norecursedirs = [
    ".claude",
    ".git",
    ".venv",
    "Papers",
    "github_Repos",
    "logs",
]

[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true
files = ["evals", "inputs", "tools", "memory", "main.py", "tests", "agent_shield_providers"]
# agent_shield/targets/ adapters intentionally import external sibling projects
# (e.g. ai-health-journal) that are not dependencies, so mypy cannot resolve them.
exclude = "(^\\.claude/|^\\.venv/|^Papers/|^github_Repos/|^logs/|^agent_shield/targets/)"

# Skip analysing the target adapters even when a test imports them: they reach
# into a sibling project that is not a static dependency.
[[tool.mypy.overrides]]
module = "agent_shield.targets.*"
follow_imports = "skip"
ignore_missing_imports = true

# pandas has no bundled stubs; only tests/test_tr_audit.py touches it.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# These modules deliberately re-export names for import-side use and test sync
# (evals/tools.py re-exports the TL-01 payload on purpose; schemas re-exports
# its SCHEMA_* constants). Allow the implicit re-export rather than adding
# bookkeeping __all__ lists.
[[tool.mypy.overrides]]
module = ["evals.tools", "agent_shield.external_corpus.schemas"]
implicit_reexport = true

# Tests are checked for real type errors (bad args, wrong returns, attr typos)
# but exempt from signature-annotation ceremony and generic-arg strictness:
# a `def test_x():` with no `-> None` carries no signal, and pytest fixtures
# already document intent. Tighten by annotating tests if that changes.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
no_implicit_reexport = false
